<div class='container'>

    <h5>
        Version Info
    </h5>
    <table class="table">
        <tr>
            <th width="120">Component</th>
            <th width="120">Version</th>
        </tr>
        <tr>
            <td>Syndicast-backend</td>
            <td><div class='loader' ng-if="version.length &lt;= 0"></div>{{version}}</td>
        </tr>
        <tr>
            <td>Syndicast-ui</td>
            <td id='uiversion'><div class='loader'></div></td>
        </tr>
        <tr>
            <td>FFMPEG</td>
            <td><div class='loader' ng-if="version.length &lt;= 0"></div>{{ffmpegVersion}}</td>
        </tr>
        <tr>
            <td>nodejs</td>
            <td><div class='loader' ng-if="version.length &lt;= 0"></div>{{nodejs}}</td>
        </tr>
        <tr>
            <td>Git commit</td>
            <td><div class='loader' ng-if="version.length &lt;= 0"></div>{{gitCommit}}<span ng-if="gitDirty"> (modified)</span></td>
        </tr>
        <tr>
            <td>Server start time</td>
            <td><div class='loader' ng-if="version.length &lt;= 0"></div>{{startTime | date:'medium'}}</td>
        </tr>

        <!-- coming soon: plex version, whatever can be used to help debug things-->
    </table>

</div>
