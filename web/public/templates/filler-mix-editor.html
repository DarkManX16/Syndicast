<div>
    <div class="form-row" ng-repeat-start="x in mix" ng-style="datesPassed(x) ? {opacity: 0.55} : {}">
        <div class='form-group col-md-4'>
            <label ng-if="$index==0" for="fillerselect{{uid}}-{{$index}}">List</label>
            <select
                id="fillerselect{{uid}}-{{$index}}" class="custom-select form-control"
                ng-model="x.id" ng-options="o.id as o.name for o in x.options"
                ng-change="refresh()"
                >
            </select>
            <small ng-if="datesWord(x)" class="mix-dates-word" ng-class="{'text-muted': datesPassed(x)}">{{datesWord(x)}}</small>
        </div>
        <div class='form-group col-md-1' >
            <label ng-if="$index==0" for="dates{{uid}}-{{$index}}">Dates</label>
            <button id='dates{{uid}}-{{$index}}' type="button" class='btn btn-link form-control' ng-if="x.id !== 'none'"
                ng-click='toggleDates(x)' title="Only on these dates">
                <i class='fa fa-calendar-alt' ng-class="{'text-info': x.dates}"></i>
            </button>
        </div>
        <div class='form-group col-md-2' ng-if="x.id !== 'none'" >
            <label ng-if="$index==0" for="cooldown{{uid}}-{{$index}}">Cooldown (minutes)</label>
            <input class='form-control' id="cooldown{{uid}}-{{$index}}" type='number' ng-model='x.cooldownMinutes' ng-pattern="/^([0-9][0-9]*)$/"
            min='0' max='10080'
            data-toggle="tooltip" data-placement="bottom" title="The channel won&apos;t pick a video from this list if it played something from this list less than this amount of minutes ago."
            > </input>
        </div>
        <div class='form-group col-md-2' ng-if="x.id === 'none'" >
        </div>
        <div class='form-group col-md-3' ng-if="x.id !== 'none' && mix.length > 2" >
            <label ng-if="$index==0" for="fillerrange{{uid}}-{{$index}}">Weight</label>
            <input class='form-control-range custom-range' id="fillerrange{{uid}}-{{$index}}" type='range' ng-model='x.weight' min=1 max=600
            data-toggle="tooltip" data-placement="bottom" title="Lists with more weight will be picked more frequently."
             ng-change="refresh()"
            >
            </input>
        </div>
        <div class='form-group col-md-4' ng-if="x.id === 'none' || mix.length <= 2" >
        </div>
        <div class='form-group col-md-1' ng-if="x.id !== 'none' && mix.length > 2" >
            <label ng-if="$index==0" for="fillerp{{uid}}-{{$index}}">%</label>
            <input class='form-control flex-filler-percent' id="fillerp{{uid}}-{{$index}}" type='text' ng-model='x.percentage'
            data-toggle="tooltip" data-placement="bottom" title="This is the overall probability this list might be picked, assuming all lists are available." readonly
            >
            </input>
        </div>
        <div class='form-group col-md-1' ng-if="x.id !== 'none'" >
            <label ng-if="$index==0" for="delete{{uid}}-{{$index}}">-</label>
            <button id='delete{{uid}}-{{$index}}' class='btn btn-link form-control' ng-click='deleteRow($index)' >
                <i class='text-danger fa fa-trash-alt'></i>
            </button>
        </div>
    </div>
    <div class="form-row mix-dates-form" ng-repeat-end ng-if="datesForm.row === x" style="margin-bottom: 8px;">
        <div class="col-auto"><label class="small" style="margin: 6px 0 0 0;">Only on these dates <span class="text-muted">(blank = any date)</span></label></div>
        <div class="col-auto">
            <input type="date" class="form-control form-control-sm" ng-model="datesForm.from" ng-change="datesChanged()">
        </div>
        <div class="col-auto" style="padding-top: 4px;">to</div>
        <div class="col-auto">
            <input type="date" class="form-control form-control-sm" ng-model="datesForm.to" ng-change="datesChanged()">
        </div>
        <div class="col-12"><small class="text-danger" ng-if="datesForm.error">{{datesForm.error}}</small></div>
    </div>
</div>
