<div>
<div class="modal" tabindex="-1" role="dialog" style="display: block; background-color: rgba(0, 0, 0, .5);">
    <div class="modal-dialog modal-lg modal-dialog-scrollable" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">{{verb}} {{title}}</h5>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning py-1 px-2 small" ng-show="error">{{error}}</div>

                <div ng-show="state === 'pick'">
                    <div class="btn-group btn-group-sm" role="group" style="margin-bottom: 8px;">
                        <button type="button" class="btn" ng-class="source === 'show' ? 'btn-primary' : 'btn-outline-primary'" ng-click="setSource('show')">This show</button>
                        <button type="button" class="btn" ng-class="source === 'other' ? 'btn-primary' : 'btn-outline-primary'" ng-click="setSource('other')">Other shows on this channel</button>
                        <button type="button" class="btn" ng-class="source === 'custom' ? 'btn-primary' : 'btn-outline-primary'" ng-click="setSource('custom')">Custom shows</button>
                        <button type="button" class="btn" ng-class="source === 'holiday' ? 'btn-primary' : 'btn-outline-primary'" ng-click="setSource('holiday')">Holiday episodes</button>
                        <button type="button" class="btn btn-outline-primary" ng-click="openLibrary()">From the library...</button>
                    </div>
                    <div ng-show="source === 'other'" style="margin-bottom: 8px;">
                        <select class="form-control form-control-sm" ng-model="pick.show" ng-change="reload()"
                            ng-options="s.id as s.name for s in shows"></select>
                    </div>
                    <div ng-show="source === 'custom'" style="margin-bottom: 8px;">
                        <select class="form-control form-control-sm" ng-model="pick.custom" ng-change="reload()"
                            ng-options="s.id as s.name for s in customShows">
                            <option value="">Choose a custom show</option>
                        </select>
                    </div>
                    <input type="text" class="form-control form-control-sm" placeholder="Filter by title or holiday" ng-model="filter.text" style="margin-bottom: 8px;">
                    <div class="small text-muted" ng-show="loading">Reading...</div>
                    <div class="list-group" style="max-height: 50vh; overflow-y: auto;">
                        <button type="button" class="list-group-item list-group-item-action py-1 small"
                            ng-repeat="row in items | filter:visible track by $index" ng-click="choose(row)">
                            <span>{{row.label}}</span>
                            <span class="badge badge-warning" ng-show="row.holiday">{{row.holiday}}</span>
                            <span class="float-right">
                                {{row.length}}
                                <span class="text-success" ng-show="row.fits">fits</span>
                                <span class="text-danger" ng-show="!row.fits">runs {{row.over}} over</span>
                            </span>
                        </button>
                    </div>
                </div>

                <div ng-show="state === 'choose'">
                    <div class="card" ng-repeat="o in options" style="margin-bottom: 8px;">
                        <div class="card-body py-2 px-3">
                            <button class="btn btn-sm btn-primary" ng-click="apply(o)" ng-disabled="o.refused">{{o.label}}</button>
                            <span class="small" style="margin-left: 8px;">{{o.text}}</span>
                        </div>
                    </div>
                    <div ng-show="breaks.length > 0" style="margin-bottom: 8px;">
                        <div class="small">Or put it in a break where it fits:</div>
                        <div ng-repeat="b in breaks"><button class="btn btn-sm btn-link" ng-click="putInBreak(b)">{{b.text}}</button></div>
                    </div>
                    <button class="btn btn-sm btn-outline-secondary" ng-click="back()">Pick something else</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-sm btn-link" ng-click="cancel()">Cancel</button>
            </div>
        </div>
    </div>
</div>
<plex-library height="300" limit="1" visible="library.open" on-finish="libraryDone"></plex-library>
</div>
